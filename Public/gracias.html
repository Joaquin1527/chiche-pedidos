<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias - Chiche Hamburguesería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: oklch(0.14 0.01 30);
    font-family: 'Manrope', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
  }
  .card {
    max-width: 380px;
    text-align: center;
  }
  .icon { font-size: 52px; margin-bottom: 10px; }
  h1 { color: oklch(0.97 0.005 30); font-size: 21px; font-weight: 800; margin: 0 0 10px; }
  p { color: oklch(0.6 0.015 30); font-size: 14px; line-height: 1.6; margin: 0; }
  .brand { color: oklch(0.62 0.19 25); font-weight: 800; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🍔</div>
    <h1>¡Gracias por tu pedido!</h1>
    <p>Ya podés cerrar esta ventana y volver a la pestaña donde hiciste tu pedido en <span class="brand">Chiche Hamburguesería</span> — ahí vas a ver la confirmación en unos segundos.</p>
  </div>
</body>
</html>
