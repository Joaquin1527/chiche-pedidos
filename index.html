<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chiche Hamburguesería — Cobros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <div class="brand">
          <div class="brand-name">CHICHE<span class="brand-dot">.</span></div>
          <div class="brand-sub">Panel de cobros</div>
        </div>
        <div class="brand-badge">C</div>
      </div>
      <input id="employeeName" type="text" placeholder="Tu nombre (empleado)" class="input" />
      <button id="toggleTienda" class="btn-tienda abierta" type="button">
        <span id="toggleTiendaIcon">🟢</span>
        <span id="toggleTiendaTexto">Tienda ABIERTA — tocá para cerrar</span>
      </button>
    </header>

    <!-- Nuevo pedido -->
    <section class="card">
      <h2 class="card-title">Nuevo pedido</h2>

      <input id="customerName" type="text" placeholder="Nombre del cliente" class="input" />

      <div id="itemsList" class="items-list">
        <!-- item rows injected by app.js -->
      </div>

      <button id="addItemBtn" class="btn-dashed">+ Agregar producto</button>

      <div class="payment-row">
        <button id="payMercadoPago" class="btn-toggle active" data-method="mercadopago">Mercado Pago</button>
        <button id="payTransferencia" class="btn-toggle" data-method="transferencia">Transferencia</button>
      </div>

      <div class="divider"></div>

      <div class="total-row">
        <span class="total-label">Total</span>
        <span id="totalAmount" class="total-amount">$0</span>
      </div>

      <button id="generateChargeBtn" class="btn-primary" disabled>Generar cobro</button>
    </section>

    <!-- Pedido activo: QR / link / estado en vivo -->
    <section id="panelPedidoActivo" class="card hidden">
      <h2 class="card-title">Pedido en curso</h2>
      <div id="detallePedidoActivo"></div>
    </section>

    <!-- Pedidos de hoy -->
    <section class="card">
      <div class="orders-header">
        <h2 class="card-title">Pedidos de hoy</h2>
        <span id="orderCount" class="order-count">0</span>
      </div>
      <div id="ordersEmpty" class="orders-empty">Todavía no hay pedidos hoy.</div>
      <div id="ordersList" class="orders-list"></div>
    </section>

  </div>
</div>

<!-- item row template (used by app.js) -->
<template id="itemRowTemplate">
  <div class="item-row" data-item>
    <div class="item-row-main">
      <select class="select product-select" data-field="product"></select>
      <input type="number" min="1" value="1" class="input qty-input" data-field="qty" />
      <button class="btn-remove" data-action="remove" aria-label="Quitar producto">×</button>
    </div>
    <div class="item-row-custom" data-custom hidden>
      <input type="text" placeholder="Nombre del producto" class="input" data-field="customName" />
      <input type="number" min="0" placeholder="Precio" class="input custom-price" data-field="customPrice" />
    </div>
  </div>
</template>

<!-- order card template (used by app.js) -->
<template id="orderCardTemplate">
  <div class="order-card">
    <div class="order-top">
      <span class="badge" data-field="badge"></span>
      <span class="order-time" data-field="time"></span>
    </div>
    <div class="order-customer" data-field="customerName"></div>
    <div class="order-items" data-field="itemsSummary"></div>
    <div data-field="listoSlot"></div>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
